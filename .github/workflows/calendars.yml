# Rebuilds the subscribable calendar feeds in calendars/ whenever a team's
# data.js changes, so subscribers always see the latest dates, times and
# scores even if nobody remembered to run tools/build-calendars.js.
name: Calendar feeds

on:
  push:
    branches: [main]
    paths:
      - "*/js/data.js"
      - "tools/build-calendars.js"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: calendar-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the feeds
        run: node tools/build-calendars.js
      - name: Publish changed feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain calendars)" ]; then
            echo "Feeds already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars
          git commit -m "Update calendar feeds"
          git push
          # pushes made by this workflow don't always start a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
