# Rebuilds the subscribable calendar feeds in calendars/ and the link preview
# images in images/og/ whenever a team's data.js changes, so subscribers and
# shared links always show the latest dates, records and scores even if
# nobody remembered to run tools/build-calendars.js or tools/build-og.sh.
name: Calendar feeds

on:
  push:
    branches: [main]
    paths:
      - "*/js/data.js"
      - "tools/build-calendars.js"
      - "tools/build-og.sh"
      - "tools/og/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: calendar-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the feeds
        run: node tools/build-calendars.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the link preview images
        continue-on-error: true   # the calendar feeds still publish if this step has a problem
        env:
          TZ: America/New_York      # game times in data.js are Danvers local time
        run: |
          pip install --quiet pillow
          tools/build-og.sh
      - name: Publish changed feeds and previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain calendars images/og)" ]; then
            echo "Feeds and previews already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars images/og
          git commit -m "Update calendar feeds and link previews"
          git push
          # pushes made by this workflow don't always start a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
