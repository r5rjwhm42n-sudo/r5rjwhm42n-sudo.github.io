<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f4d">
<title>Offline · Danvers Falcons</title>
<link rel="icon" href="/images/falcons-logo.png">
<style>
  :root { --navy: #0b1f4d; --royal: #18479f; --gold: #f0b429; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff;
    font-family: "Saira Condensed", "Arial Narrow", Impact, sans-serif; text-align: center;
    background: linear-gradient(115deg, var(--navy) 0%, var(--royal) 62%, #2459c2 100%);
  }
  .badge { width: 112px; height: 112px; margin: 0 auto 26px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 0 0 5px var(--gold), 0 18px 40px rgba(0, 0, 0, .35); animation: float 3s ease-in-out infinite; }
  .badge img { width: 78px; height: 78px; }
  h1 { margin: 0 0 10px; font-size: clamp(42px, 9vw, 72px); line-height: .95; text-transform: uppercase; letter-spacing: .01em; }
  p { margin: 0 auto 26px; max-width: 420px; font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #dbe5fb; }
  button { font: 700 19px "Saira Condensed", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--royal);
    background: #fff; border: 0; border-radius: 4px; padding: 12px 26px 11px; cursor: pointer; }
  button:hover { background: #e6edfc; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .badge { animation: none; } }
</style>
</head>
<body>
  <main>
    <div class="badge"><img src="/images/falcons-logo.png" alt="Danvers Falcons"></div>
    <h1>No signal in the stands</h1>
    <p>You're offline. Pages you've already opened still work, and fresh scores load as soon as you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
